name: Build merlin kernel (container support)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex git gnupg gperf \
            lz4 libxml2-dev libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev zstd gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu python3 cpio

      - name: Fetch clang
        run: |
          wget -q -O clang.tar.zst https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst
          mkdir -p clang
          tar -I zstd -xf clang.tar.zst -C clang
          if [ "$(ls -1 clang | wc -l)" = "1" ] && [ -d "clang/$(ls -1 clang | head -1)" ]; then
            inner="clang/$(ls -1 clang | head -1)"
            mv "$inner"/* clang/ 2>/dev/null || true
            rmdir "$inner" 2>/dev/null || true
          fi
          chmod -R +x clang/bin || true
          clang/bin/clang --version | head -3

      - name: Clone kernel source (official Xiaomi R OSS, 4.14.186)
        run: |
          git clone --depth=1 -b main https://github.com/mitsu00/merlin-r-oss kernel
          head -6 kernel/Makefile

      - name: Configure (stock ROM config + container options)
        run: |
          set -euo pipefail
          export PATH=$PWD/clang/bin:$PATH
          mkdir -p kernel/out
          cp config/base.config kernel/out/.config
          printf '\n' >> kernel/out/.config
          cat config/extra.config >> kernel/out/.config
          make -C kernel O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig
          echo '--- container options ---'
          grep -E "^CONFIG_(SYSVIPC|SYSVIPC_SYSCTL|IPC_NS|UTS_NS|PID_NS|NET_NS|USER_NS|CGROUP_DEVICE|CGROUP_PIDS|CGROUP_NET_PRIO|BLK_CGROUP|BRIDGE_NETFILTER|NETFILTER_XT_MATCH_ADDRTYPE|NETFILTER_XT_MATCH_MULTIPORT|IP_NF_TARGET_TCPMSS|MACVLAN|IPVLAN|VXLAN|OVERLAY_FS|OVL_FS)=" kernel/out/.config | sort
          echo '--- version ---'
          grep -E '^CONFIG_(LOCALVERSION|LOCALVERSION_AUTO)=' kernel/out/.config

      - name: Compiler probe
        run: |
          export PATH=$PWD/clang/bin:$PATH
          echo 'int f(void){return 0;}' > /tmp/t.c
          clang --target=aarch64-linux-gnu -fstack-protector-strong -c /tmp/t.c -o /tmp/t.o && echo SSP_OK || echo SSP_FAIL
          clang --target=aarch64-linux-gnu -mgeneral-regs-only -c /tmp/t.c -o /tmp/t.o && echo MGR_OK || echo MGR_FAIL
          clang --target=aarch64-linux-gnu -dumpmachine
          echo "--- toolchain probe ---"
          which aarch64-linux-gnu-elfedit || echo NO_ELFEDIT
          aarch64-linux-gnu-as --version | head -1 || echo NO_AS
          PFX=$(dirname "$(which aarch64-linux-gnu-elfedit 2>/dev/null || echo /usr/bin/x)")
          echo "prefix=$PFX"
          clang --target=aarch64-linux-gnu --prefix="$PFX" -no-integrated-as -Werror=unknown-warning-option -fstack-protector-strong -c /tmp/t.c -o /tmp/t.o && echo PREFIX_SSP_OK || echo PREFIX_SSP_FAIL

      - name: Build kernel
        run: |
          set -o pipefail
          sed -i 's/^ifdef stackp-name$/ifdef stackp-name_SKIPPED/' kernel/Makefile
          export PATH=$PWD/clang/bin:$PATH
          make -C kernel O=out ARCH=arm64 -j"$(nproc)" \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CONFIG_NO_ERROR_ON_MISMATCH=y TARGET_BUILD_VARIANT=user \
            Image.gz-dtb 2>&1 | tee build.log
          ls -l kernel/out/arch/arm64/boot/Image.gz-dtb

      - name: Verify built kernel config
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb .
          kernel/scripts/extract-ikconfig Image.gz-dtb > built-config.txt 2>/dev/null || true
          echo "built-config lines: $(wc -l < built-config.txt)"
          grep -E "^CONFIG_(SYSVIPC|IPC_NS|CGROUP_DEVICE|CGROUP_PIDS|NETFILTER_XT_MATCH_ADDRTYPE|BRIDGE_NETFILTER|USER_NS|LOCALVERSION)=" built-config.txt || true
          strings Image.gz-dtb | grep -m2 -E '^[0-9]+\.[0-9]+\.[0-9]+.*(SMP|g[0-9a-f]{8})' || true

      - name: Package AnyKernel3 zip
        run: |
          set -euo pipefail
          git clone --depth=1 -b shockwave https://github.com/MrShockWAVEog/AnyKernel3.git ak3
          cp Image.gz-dtb ak3/
          rm -rf ak3/.git
          cd ak3
          zip -r9 ../merlin-container-kernel.zip . -x '*.git*' > /dev/null
          cd ..
          ls -l merlin-container-kernel.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: merlin-container-kernel
          path: |
            merlin-container-kernel.zip
            Image.gz-dtb
            built-config.txt
            build.log
          if-no-files-found: error
