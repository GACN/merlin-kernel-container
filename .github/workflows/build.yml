name: Build merlinx kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # plain = device's own ROM config + container/Docker capability only
        # guard = same, plus an in-kernel no-suspend guard (replaces the Magisk module)
        variant: [plain, guard]
    env:
      VARIANT: ${{ matrix.variant }}
      KERNEL_REPO: https://github.com/Redmi-MT6768/android_kernel_xiaomi_mt6768
      KERNEL_BRANCH: eleven
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902b.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex git gnupg gperf \
            lz4 libxml2-dev libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev zstd cpio \
            gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu python3

      - name: Fetch clang r383902b (the clang 11.0.2 the ROM was built with)
        run: |
          set -euo pipefail
          curl -sSL --retry 3 -o clang.tar.gz "$CLANG_URL"
          mkdir -p clang
          tar -xzf clang.tar.gz -C clang
          chmod -R +x clang/bin || true
          clang/bin/clang --version | head -3

      - name: Clone kernel source
        run: |
          set -euo pipefail
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) ' kernel/Makefile

      - name: Patch kernel Makefile for clang + GNU binutils
        run: python3 tools/patch_makefile.py

      - name: Stub missing vendor firmware blobs
        run: |
          set -euo pipefail
          cd kernel
          make_stub() { printf '0x00, 0x00, 0x00, 0x00,\n' > "$1"; }
          created=0
          while IFS= read -r f; do
            d=$(dirname "$f")
            while IFS= read -r rel; do
              [ -n "$rel" ] || continue
              mkdir -p "$d/$(dirname "$rel")"
              if [ ! -f "$d/$rel" ]; then make_stub "$d/$rel"; echo "stub: $d/$rel"; created=$((created+1)); fi
            done < <(grep -oE '"[^"]*firmware/[^"]+\.i"' "$f" | tr -d '"' | sort -u)
          done < <(grep -rlE 'firmware/[^"]+\.i' --include='*.c' --include='*.h' . 2>/dev/null || true)
          echo "stubs created: $created"

      - name: Neutralize -Werror tree-wide
        run: |
          set -euo pipefail
          cd kernel
          n=0
          while IFS= read -r f; do
            if grep -q -e '-Werror' "$f"; then
              sed -i 's/-Werror/-Wno-error/g' "$f"
              echo "patched: $f"
              n=$((n+1))
            fi
          done < <(grep -rl -e '-Werror' --include='Makefile' --include='Kbuild' --include='Makefile.*' --include='*.mk' . 2>/dev/null || true)
          echo "-Werror neutralized in $n makefiles"

      - name: Strip + from localversion
        run: |
          set -euo pipefail
          cd kernel
          if grep -q 'res="$res${scm:++}"' scripts/setlocalversion; then
            sed -i 's|res="$res${scm:++}"|res="$res"|' scripts/setlocalversion
            echo "patched scripts/setlocalversion: no + suffix"
          else
            echo "setlocalversion pattern not found (continuing)"
          fi

      - name: Apply in-kernel no-suspend guard (guard variant only)
        if: matrix.variant == 'guard'
        run: |
          set -euo pipefail
          cd kernel
          python3 ../scripts/guard_patch.py
          grep -n 'merlinx_no_suspend' kernel/power/suspend.c | head

      - name: Configure (device config + container fragment)
        run: |
          set -euo pipefail
          export PATH=$PWD/clang/bin:$PATH
          mkdir -p kernel/out
          cp config/base.config kernel/out/.config
          printf '\n' >> kernel/out/.config
          cat config/extra.config >> kernel/out/.config
          make -C kernel O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig
          echo '--- resolved key options ---'
          grep -E '^CONFIG_(LOCALVERSION|SYSVIPC|IPC_NS|USER_NS|CGROUP_PIDS|CGROUP_DEVICE|CFS_BANDWIDTH|DEVTMPFS|NF_TABLES|NETFILTER_XT_MATCH_ADDRTYPE|IP6_NF_NAT|MACVLAN|MTK_COMBO_WIFI|MTK_COMBO_BT|MTK_WATCHDOG)=' kernel/out/.config

      - name: Build kernel
        run: |
          set -o pipefail
          export PATH=$PWD/clang/bin:$PATH
          make -C kernel O=out ARCH=arm64 -k -j"$(nproc)" \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS=-Wno-error \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_NO_ERROR_ON_MISMATCH=y TARGET_BUILD_VARIANT=user \
            Image.gz Image.gz-dtb 2>&1 | tee build.log
          ls -l kernel/out/arch/arm64/boot/Image.gz kernel/out/arch/arm64/boot/Image.gz-dtb

      - name: Summarize build errors
        if: failure()
        run: |
          echo '--- unique errors ---'
          grep -hE ' error: |[Ff]atal error|No rule to make target|undefined reference' build.log \
            | sed -E 's/^\.\.\///' | sort -u | head -60 || true

      - name: Verify config keeps hardware and gains containers
        run: |
          set -euo pipefail
          cp kernel/out/arch/arm64/boot/Image.gz-dtb "Image-$VARIANT.gz-dtb"
          cp kernel/out/arch/arm64/boot/Image.gz "Image-$VARIANT.gz"
          kernel/scripts/extract-ikconfig "Image-$VARIANT.gz-dtb" > "built-config-$VARIANT.txt" 2>/dev/null || true
          echo "config lines: $(wc -l < built-config-$VARIANT.txt)"

          fail=0
          require() {
            if ! grep -qE "^$1=(y|m|\"[^\"]*\")" "built-config-$VARIANT.txt"; then
              echo "::error::missing required option $1"
              fail=1
            fi
          }
          for o in CONFIG_SYSVIPC CONFIG_IPC_NS CONFIG_USER_NS CONFIG_CGROUP_PIDS \
                   CONFIG_CGROUP_DEVICE CONFIG_CFS_BANDWIDTH CONFIG_DEVTMPFS \
                   CONFIG_NF_TABLES CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
                   CONFIG_IP6_NF_NAT CONFIG_MACVLAN CONFIG_OVERLAY_FS; do
            require "$o"
          done
          for o in CONFIG_MTK_COMBO_WIFI CONFIG_MTK_COMBO_BT CONFIG_MTK_FINGERPRINT_SUPPORT \
                   CONFIG_MTK_LCM CONFIG_MTK_ION CONFIG_MTK_WATCHDOG; do
            require "$o"
          done
          grep -q 'CONFIG_LOCALVERSION="-pizza"' "built-config-$VARIANT.txt" \
            || { echo "::error::CONFIG_LOCALVERSION changed"; fail=1; }
          [ "$fail" = "0" ] || exit 1

      - name: Verify kernel version string
        run: |
          set -euo pipefail
          gzip -dc "Image-$VARIANT.gz" > Image.raw
          echo "kernel string: $(strings Image.raw | grep -m1 -E 'Linux version [0-9]' | cut -c1-120)"
          strings Image.raw | grep -q -- '-pizza' \
            || { echo "::error::localversion -pizza missing from kernel image"; exit 1; }
          strings Image.raw | grep -m1 'mod_unload' || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}
          path: |
            Image-${{ matrix.variant }}.gz
            Image-${{ matrix.variant }}.gz-dtb
            built-config-${{ matrix.variant }}.txt
            build.log
          if-no-files-found: error
