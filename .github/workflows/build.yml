name: Build merlin kernel (container support)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # plain = container support only; ksu = same + KernelSU v0.9.5 (root)
        variant: [plain, ksu]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex git gnupg gperf \
            lz4 libxml2-dev libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev zstd \
            gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu python3 cpio

      - name: Fetch clang
        run: |
          wget -q -O clang.tar.zst https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst
          mkdir -p clang
          tar -I zstd -xf clang.tar.zst -C clang
          if [ "$(ls -1 clang | wc -l)" = "1" ] && [ -d "clang/$(ls -1 clang | head -1)" ]; then
            inner="clang/$(ls -1 clang | head -1)"
            mv "$inner"/* clang/ 2>/dev/null || true
            rmdir "$inner" 2>/dev/null || true
          fi
          chmod -R +x clang/bin || true
          clang/bin/clang --version | head -3

      - name: Clone kernel source (official Xiaomi R OSS, 4.14.186)
        run: |
          git clone --depth=1 -b main https://github.com/mitsu00/merlin-r-oss kernel
          head -5 kernel/Makefile
          python3 tools/patch_makefile.py

      - name: Integrate KernelSU v0.9.5 (non-GKI manual hooks)
        if: matrix.variant == 'ksu'
        run: |
          set -euo pipefail
          # KernelSU >= 1.0 dropped non-GKI support; 0.9.5 is the last usable on 4.14.
          cd kernel
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s v0.9.5
          cd ..
          python3 tools/add_ksu_hooks.py kernel
          ls -ld kernel/drivers/kernelsu
          grep -n kernelsu kernel/drivers/Makefile kernel/drivers/Kconfig || true
          grep -n 'ksu_handle_' kernel/fs/exec.c | head -3

      - name: Stub missing vendor firmware blobs
        run: |
          set -euo pipefail
          cd kernel
          # MTK OSS releases ship focaltech_config.h referencing vendor fw blobs
          # (include/firmware/*.i) that are NOT in the OSS tree. Without them the
          # touchscreen driver cannot compile. Create zero-filled placeholders;
          # at runtime the driver falls back to request_firmware() from /vendor.
          make_stub() { printf '0x00, 0x00, 0x00, 0x00,\n' > "$1"; }
          created=0
          while IFS= read -r f; do
            d=$(dirname "$f")
            while IFS= read -r rel; do
              [ -n "$rel" ] || continue
              mkdir -p "$d/$(dirname "$rel")"
              if [ ! -f "$d/$rel" ]; then
                make_stub "$d/$rel"
                echo "stub: $d/$rel"
                created=$((created+1))
              fi
            done < <(grep -oE '"[^"]*firmware/[^"]+\.i"' "$f" | tr -d '"' | sort -u)
          done < <(grep -rlE 'firmware/[^"]+\.i' --include='*.c' --include='*.h' . 2>/dev/null || true)
          echo "stubs created: $created"

      - name: Neutralize -Werror tree-wide
        run: |
          set -euo pipefail
          cd kernel
          # kernel/Makefile gates -Werror=strict-prototypes / implicit-int /
          # incompatible-pointer-types on, and some subdir Makefiles add plain
          # -Werror. 4.14 sources are nowhere near clean under clang 20, so every
          # -Werror form is downgraded to -Wno-error before compiling.
          n=0
          while IFS= read -r f; do
            if grep -q -e '-Werror' "$f"; then
              sed -i 's/-Werror/-Wno-error/g' "$f"
              echo "patched: $f"
              n=$((n+1))
            fi
          done < <(grep -rl -e '-Werror' --include='Makefile' --include='Kbuild' --include='Makefile.*' --include='*.mk' . 2>/dev/null || true)
          echo "-Werror neutralized in $n makefiles"
          grep -c -e '-Werror' Makefile || echo "kernel/Makefile: no -Werror left"

      - name: Provide stpcpy (clang libcall gap)
        run: |
          set -euo pipefail
          cd kernel
          # clang >= 19 lowers some strcpy()/memcpy patterns to calls to stpcpy()
          # even in freestanding builds. 4.14 predates stpcpy, so vmlinux fails
          # to link with 'undefined reference to stpcpy'. Provide it; optnone
          # keeps the compiler from rewriting this into a self-call.
          if grep -q '^char \*stpcpy' lib/string.c; then
            echo "stpcpy already present"
          else
            cat >> lib/string.c <<'EOF'

          /*
           * Not part of 4.14: newer clang emits calls to stpcpy() for some strcpy()
           * patterns, so the symbol must exist or vmlinux will not link.
           */
          #if defined(__clang__)
          __attribute__((optnone))
          #endif
          char *stpcpy(char *dest, const char *src)
          {
          	while ((*dest = *src) != '\0') {
          		dest++;
          		src++;
          	}
          	return dest;
          }
          EXPORT_SYMBOL(stpcpy);
          EOF
            echo "appended stpcpy to lib/string.c"
          fi
          grep -n 'stpcpy' lib/string.c

      - name: Strip + from localversion (vermagic)
        run: |
          set -euo pipefail
          cd kernel
          # vermagic must match the stock vendor modules exactly:
          #   4.14.186-perf-g6f6f342de0ae SMP preempt mod_unload modversions aarch64
          # (verified by scanning the stock vendor.img for the .modinfo string)
          # scripts/setlocalversion appends '+' whenever the git tree is dirty -
          # and our own patches always dirty it - so that marker is removed here.
          if grep -q 'res="$res${scm:++}"' scripts/setlocalversion; then
            sed -i 's|res="$res${scm:++}"|res="$res"|' scripts/setlocalversion
            echo "patched scripts/setlocalversion: no + suffix"
          else
            echo "::warning::setlocalversion plus-sign pattern not found"
          fi
          grep -n 'scm:++' scripts/setlocalversion || echo 'plus-sign logic gone'

      - name: Toolchain info
        run: |
          export PATH=$PWD/clang/bin:$PATH
          aarch64-linux-gnu-gcc --version | head -1
          aarch64-linux-gnu-as --version | head -1
          clang --version | head -2

      - name: Configure (stock ROM config + container options)
        run: |
          set -euo pipefail
          export PATH=$PWD/clang/bin:$PATH
          mkdir -p kernel/out
          cp config/base.config kernel/out/.config
          printf '\n' >> kernel/out/.config
          cat config/extra.config >> kernel/out/.config
          if [ "$VARIANT" = ksu ]; then
            echo 'CONFIG_KSU=y' >> kernel/out/.config
          fi
          make -C kernel O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig
          echo '--- container options ---'
          grep -E "^CONFIG_(SYSVIPC|IPC_NS|UTS_NS|PID_NS|NET_NS|USER_NS|CGROUP_DEVICE|CGROUP_PIDS|CGROUP_NET_PRIO|BLK_CGROUP|BRIDGE_NETFILTER|NETFILTER_XT_MATCH_ADDRTYPE|MACVLAN|IPVLAN|VXLAN|OVERLAY_FS|KSU)=" kernel/out/.config | sort
          echo '--- version ---'
          grep -E '^CONFIG_LOCALVERSION' kernel/out/.config

      - name: Diagnose compiler flags
        run: |
          export PATH=$PWD/clang/bin:$PATH
          make -C kernel O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- V=1 mm/vmscan.o 2>&1 | grep -m2 -E 'clang' | head -3

      - name: Build kernel
        run: |
          set -o pipefail
          export PATH=$PWD/clang/bin:$PATH
          sed -i 's/^ifdef stackp-name$/ifdef stackp-name_SKIPPED/' kernel/Makefile
          make -C kernel O=out ARCH=arm64 -k -j"$(nproc)" \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS=-Wno-error \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CONFIG_NO_ERROR_ON_MISMATCH=y TARGET_BUILD_VARIANT=user \
            Image.gz-dtb 2>&1 | tee build.log
          ls -l kernel/out/arch/arm64/boot/Image.gz-dtb

      - name: Summarize build errors
        if: failure()
        run: |
          echo '--- unique errors ---'
          grep -hE ' error: |[Ff]atal error|No rule to make target|undefined reference' build.log \
            | sed -E 's/^\.\.\///' | sort -u | head -60 || true

      - name: Verify built kernel config
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb "Image-$VARIANT.gz-dtb"
          kernel/scripts/extract-ikconfig "Image-$VARIANT.gz-dtb" > "built-config-$VARIANT.txt" 2>/dev/null || true
          echo "built-config lines: $(wc -l < "built-config-$VARIANT.txt")"
          grep -E "^CONFIG_(SYSVIPC|IPC_NS|CGROUP_DEVICE|CGROUP_PIDS|NETFILTER_XT_MATCH_ADDRTYPE|BRIDGE_NETFILTER|USER_NS|LOCALVERSION)=" "built-config-$VARIANT.txt" || true
          strings "Image-$VARIANT.gz-dtb" | grep -m2 -E 'Linux version [0-9]' || true
          if [ "$VARIANT" = ksu ]; then
            grep -q '^CONFIG_KSU=y' "built-config-$VARIANT.txt" || { echo '::error::CONFIG_KSU missing from built kernel'; exit 1; }
            echo "KernelSU: built in"
          fi

      - name: Verify vermagic matches the ROM kernel
        run: |
          set -o pipefail
          gzip -dc "Image-$VARIANT.gz-dtb" > Image.raw 2>/dev/null || true
          ls -l Image.raw
          got=$(strings Image.raw | grep -m1 "mod_unload")
          want='4.14.186-g46ead2c21af1 SMP preempt mod_unload modversions aarch64'
          echo "want vermagic: $want"
          echo "got  vermagic: $got"
          echo "kernel string : $(strings Image.raw | grep -m1 -E 'Linux version [0-9]' | cut -c1-80)"
          if [ "$got" != "$want" ]; then
            echo "::error::vermagic mismatch - stock vendor .ko would be rejected"
            exit 1
          fi
          echo "vermagic OK: matches MIUI 12.5.7 stock kernel"

      - name: Package AnyKernel3 zip
        run: |
          set -euo pipefail
          git clone --depth=1 -b shockwave https://github.com/MrShockWAVEog/AnyKernel3.git ak3
          cp "Image-$VARIANT.gz-dtb" ak3/Image.gz-dtb
          # upstream ships do.devicecheck=0; turn it on so a wrong device is refused
          sed -i 's/^do.devicecheck=.*/do.devicecheck=1/' ak3/anykernel.sh
          grep -E '^do.devicecheck|^device.name[0-9]' ak3/anykernel.sh
          rm -rf ak3/.git
          cd ak3
          zip -r9 "../merlin-container-$VARIANT.zip" . -x '*.git*' > /dev/null
          cd ..
          ls -l "merlin-container-$VARIANT.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: merlin-container-${{ matrix.variant }}
          path: |
            merlin-container-${{ matrix.variant }}.zip
            Image-${{ matrix.variant }}.gz-dtb
            built-config-${{ matrix.variant }}.txt
            build.log
          if-no-files-found: error
